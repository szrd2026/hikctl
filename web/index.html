<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>hikctl · 海康设备控制台</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAJ0lEQVR42mPgFRQnCTEMcg0+8//5zP+HX2RANGAiamsYVJ4eomkJAGKneSGyX+B8AAAAAElFTkSuQmCC">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<a class="skip-link" href="#main">跳到主内容</a>

<div id="app" class="app">

  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">hikctl</span>
      <span class="brand-sub">设备控制台</span>
    </div>
    <nav class="nav" id="nav" aria-label="主导航">
      <button class="nav-item" type="button" data-view="devices" aria-current="page">
        <span class="nav-ico" aria-hidden="true">▤</span><span class="nav-label">设备列表</span><span class="nav-badge" id="navBadgeDevices"></span>
      </button>
      <button class="nav-item" type="button" data-view="console">
        <span class="nav-ico" aria-hidden="true">▣</span><span class="nav-label">WEB 后台</span>
      </button>
      <button class="nav-item" type="button" data-view="discover">
        <span class="nav-ico" aria-hidden="true">◎</span><span class="nav-label">发现设备</span>
      </button>
      <button class="nav-item" type="button" data-view="tasks">
        <span class="nav-ico" aria-hidden="true">≡</span><span class="nav-label">批量任务</span><span class="nav-badge" id="navBadgeTasks"></span>
      </button>
      <button class="nav-item" type="button" data-view="report">
        <span class="nav-ico" aria-hidden="true">⎙</span><span class="nav-label">报表</span>
      </button>
    </nav>
    <button class="sidebar-toggle" type="button" id="navToggle" aria-label="折叠侧边栏" title="折叠侧边栏 (Ctrl+B)"><span aria-hidden="true">‹</span></button>
  </aside>

  <header class="topbar">
    <div class="topbar-left">
      <span class="stat"><b id="statTotal">0</b><span>设备</span></span>
      <span class="stat stat-online"><b id="statOnline">0</b><span>在线</span></span>
      <span class="stat stat-offline"><b id="statOffline">0</b><span>离线</span></span>
    </div>
    <div class="topbar-right">
      <button class="btn btn-ghost" type="button" id="btnRefresh" title="重新拉取设备列表与状态 (R)">↻ 刷新</button>
      <button class="pill" type="button" id="ssePill" title="事件流连接状态">
        <span class="dot" id="sseDot"></span><span id="sseText">连接中</span>
      </button>
      <button class="pill pill-svc" type="button" id="svcPill" title="服务状态">
        <span class="dot" id="svcDot"></span><span id="svcText">服务 …</span>
      </button>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1"></main>

  <div class="taskbar" id="taskbar" hidden>
    <div class="taskbar-head">
      <span class="taskbar-title">任务</span>
      <button class="btn btn-ghost btn-xs" type="button" id="taskbarAll">全部任务</button>
      <button class="btn btn-ghost btn-xs" type="button" id="taskbarHide" aria-label="收起任务栏" title="收起">✕</button>
    </div>
    <div class="taskbar-list" id="taskbarList"></div>
  </div>

</div>

<aside class="drawer" id="drawer" hidden aria-label="设备详情">
  <header class="drawer-head">
    <div class="drawer-title">
      <span class="dot" id="dwDot"></span>
      <span class="drawer-name" id="dwName">设备</span>
      <span class="drawer-id mono" id="dwId"></span>
    </div>
    <button class="btn btn-ghost btn-xs" type="button" id="dwClose" aria-label="关闭详情 (Esc)" title="关闭 (Esc)">✕</button>
  </header>
  <nav class="tabs" id="dwTabs" role="tablist" aria-label="设备详情标签">
    <button class="tab" type="button" role="tab" data-tab="overview">概览</button>
    <button class="tab" type="button" role="tab" data-tab="network">网络</button>
    <button class="tab" type="button" role="tab" data-tab="time">时间</button>
    <button class="tab" type="button" role="tab" data-tab="password">密码</button>
    <button class="tab" type="button" role="tab" data-tab="maintain">维护</button>
    <button class="tab" type="button" role="tab" data-tab="upgrade">升级</button>
  </nav>
  <div class="drawer-body" id="dwBody" tabindex="-1"></div>
</aside>

<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal-head">
      <h2 id="modalTitle">标题</h2>
      <button class="btn btn-ghost btn-xs" type="button" id="modalClose" aria-label="关闭 (Esc)">✕</button>
    </header>
    <div class="modal-body" id="modalBody"></div>
    <footer class="modal-foot" id="modalFoot"></footer>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script type="module" src="app.js?v=6"></script>
</body>
</html>
